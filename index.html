<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>やりくりチェッカー</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <span class="logo">やりくりチェッカー</span>
    </header>

    <!-- 進捗 -->
    <nav class="steps" id="steps" aria-label="ステップ">
      <button class="step" data-go="0"><i></i><span>残高</span></button>
      <button class="step" data-go="1"><i></i><span>給与</span></button>
      <button class="step" data-go="2"><i></i><span>請求</span></button>
      <button class="step" data-go="3"><i></i><span>結果</span></button>
    </nav>

    <div class="stage" id="stage">

      <!-- STEP 0 -->
      <section class="screen" data-screen="0">
        <div class="screen-body">
          <h1>口座残高</h1>
          <p class="lead">いまの残高と、計算の基準にする日を入力します。</p>

          <label class="f">
            <span class="f-label">現在の口座残高</span>
            <div class="money"><em>¥</em><input type="number" id="balance" inputmode="numeric" placeholder="0" /></div>
          </label>

          <label class="f">
            <span class="f-label">基準日</span>
            <input type="date" id="baseDate" />
          </label>

          <p class="note">残高はこの端末に記憶され、次回ひらくと復元されます。</p>
        </div>
        <footer class="nav">
          <span></span>
          <button class="btn primary" data-next>次へ</button>
        </footer>
      </section>

      <!-- STEP 1 -->
      <section class="screen" data-screen="1">
        <div class="screen-body">
          <h1>給与</h1>
          <p class="lead">家庭教師は末日入金。ハンバーグ屋は毎月変動する想定です。</p>

          <label class="f">
            <span class="f-label">家庭教師<small>末日に入金</small></span>
            <div class="money"><em>¥</em><input type="number" id="tutor" inputmode="numeric" placeholder="0" /></div>
            <div class="chips" id="tutorChips"></div>
          </label>

          <label class="f">
            <span class="f-label">ハンバーグ屋<small>変動・記憶しません</small></span>
            <div class="money"><em>¥</em><input type="number" id="hamburg" inputmode="numeric" placeholder="0" /></div>
          </label>

          <details class="adv">
            <summary>入金日の詳細設定</summary>
            <div class="adv-body">
              <label class="f">
                <span class="f-label">ハンバーグ屋の給料日</span>
                <select id="hamburgPayday"></select>
              </label>
              <p class="note">給料日が土日祝なら前の平日に前倒し、引き落としが土日祝なら翌営業日に繰り下げて計算します。</p>
            </div>
          </details>
        </div>
        <footer class="nav">
          <button class="btn ghost" data-back>戻る</button>
          <button class="btn primary" data-next>次へ</button>
        </footer>
      </section>

      <!-- STEP 2 -->
      <section class="screen" data-screen="2">
        <div class="screen-body">
          <h1>クレカ請求</h1>
          <p class="lead">請求額と、そのうちの交通費（Suica等）を入力します。交通費は経費用に別集計します。</p>
          <div id="cardList" class="cardlist"></div>
        </div>
        <footer class="nav">
          <button class="btn ghost" data-back>戻る</button>
          <button class="btn primary" id="calcBtn">計算する</button>
        </footer>
      </section>

      <!-- STEP 3 -->
      <section class="screen" data-screen="3">
        <div class="screen-body">
          <h1>結果</h1>
          <div id="verdict" class="verdict"></div>
          <div id="summary" class="summary"></div>

          <h2 class="sec-title">カレンダー</h2>
          <p class="note legend-row">
            <span class="legend out">引落</span>
            <span class="legend in">入金</span>
            日付をタップすると内訳が出ます。
          </p>
          <div id="calendar" class="calendar"></div>
          <div id="dayDetail" class="day-detail" hidden></div>
        </div>
        <footer class="nav">
          <button class="btn ghost" data-back>戻る</button>
          <button class="btn ghost" id="resetBtn">クリア</button>
        </footer>
      </section>

    </div>

    <footer class="foot">データはこの端末内にのみ保存され、外部送信はありません。</footer>
  </div>

  <script src="holidays.js"></script>
  <script src="app.js"></script>
</body>
</html>
